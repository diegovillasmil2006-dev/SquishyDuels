      { t: 0, punch: 'catchAbsorb', views: ['R1P'] },

  rules: { maxParticles: [60, 30], maxEffectTime: 1.5, maxFlashTime: 0.1, maxFlashOpacity: 0.3, maxFlashesPerSecond: 3, maxCenterCover: 0.3, maxHitStop: 0.12, maxShake: 2, maxFovKick: 8, maxLightsPerEffect: 1, centerClear: 0.25 },

  },
  viewer: {  // PREVIEW ONLY — stand-in rig, lights, renderer, UI

    colors: { sky: '#CFE8FF', hemiSky: '#FFF4E6', hemiGround: '#B9A6E8', sun: '#FFFFFF', ink: '#3B2A35', black: '#000000', white: '#FFFFFF', groundA: '#FFF0DA', groundB: '#FBE3C3' },
    ground: { tile: 4, checkerPx: 32, roughness: 0.95 },

/* ------------------------------- page logic (no numbers) ------------------------------- */
const V3 = THREE.Vector3;
let thr, tgt, sq, API;
const fs = {};
function fresh() { return { vm: false, mode: 'held', vel: new V3(), bounced: false, rolled: 0, rollDir: new V3(), flight: null, from: null, contacts: 0 }; }
function restY() { return CONFIG.throw.radius * CONFIG.viewer.squishy.restSquash; }
function eyeOf(av, k) { return av.group.position.clone().add(new V3(0, CONFIG.camera[k].eyeHeight, 0)); }
function handPos() {
  if (API && API.S.view === 'T1P') {
    const C = CONFIG.camera.thrower, o = CONFIG.throw.viewmodel.offset, k = C.pitch * API.DEG;
    const eye = thr.group.position.clone().add(new V3(0, C.eyeHeight, C.back)), f = new V3(0, Math.sin(k), -Math.cos(k)), u = new V3(0, Math.cos(k), Math.sin(k));
    return eye.add(new V3(o[0], 0, 0)).addScaledVector(u, o[1]).addScaledVector(f, -o[2]);
  }
  const h = thr.parts.RightHand.getWorldPosition(new V3()), o = CONFIG.throw.holdOffset;
  return h.add(new V3(o[0], o[1], o[2]));
}
function handsMid() { return tgt.parts.LeftHand.getWorldPosition(new V3()).add(tgt.parts.RightHand.getWorldPosition(new V3())).multiplyScalar(0.5); }

SquishyFX(THREE, CONFIG, {
  setup(api) {
    API = api;
    const Vw = CONFIG.viewer, St = CONFIG.stage;
    const g = new THREE.Mesh(new THREE.PlaneGeometry(St.groundSize, St.groundSize), new THREE.MeshStandardMaterial({ name: 'floor', map: api.checker(Vw.colors.groundA, Vw.colors.groundB, St.groundSize / Vw.ground.tile), roughness: Vw.ground.roughness }));
    g.name = 'Floor'; g.rotation.x = -Math.PI / 2; g.receiveShadow = true; api.scene.add(g);
    const P = St.posts, geo = new THREE.BoxGeometry(P.size[0], P.size[1], P.size[2]), mats = P.colors.map((c, i) => api.material('post' + i, c, Vw.ground.roughness));
    for (let i = 0; i < P.count; i++) for (const s of [-1, 1]) { const m = new THREE.Mesh(geo, mats[i % mats.length]); m.name = 'Post'; m.position.set(s * P.offsetX, P.size[1] / 2, -i * P.every); m.castShadow = true; api.scene.add(m); }
    thr = api.avatar({ name: 'Thrower', colors: CONFIG.avatars.thrower });
    tgt = api.avatar({ name: 'Target', colors: CONFIG.avatars.target });
    sq = api.squishy({ name: 'Squishy', color: CONFIG.throw.color, radius: CONFIG.throw.radius });
    api.scene.add(thr.group, tgt.group, sq.group);
  },
  reset(api, id, m) {
    Object.assign(fs, fresh());
    const St = CONFIG.stage;
    thr.group.position.set(0, 0, 0); thr.group.rotation.y = 0;
    tgt.group.position.set(id === 'catch' ? 0 : St.sideOffset, 0, -St.distance); tgt.group.rotation.y = Math.PI;
    thr.setFirstPerson(api.S.view === 'T1P'); tgt.setFirstPerson(api.S.view === 'R1P');
    for (const n of CONFIG.camera.thrower.hideParts) thr.parts[n].visible = api.S.view !== 'T1P';
    fs.vm = api.S.view === 'T1P'; sq.group.scale.setScalar(fs.vm ? CONFIG.throw.viewmodel.scale : 1);
    fs.obs = new V3(m.obs[0], m.obs[1], m.obs[2]);
    sq.group.visible = true; sq.spin.rotation.set(0, 0, 0);
    if (id === 'catch') { fs.mode = 'wait'; const c = St.catchPoint; fs.catchAt = tgt.group.position.clone().add(new V3(c[0], c[1], c[2])); sq.group.position.copy(fs.catchAt); }
    else { thr.update(0, 0); sq.group.position.copy(handPos()); sq.face(new V3(0, 0, -1)); }
  },
  update(api, dt) {
    const B = CONFIG.bounce, T = CONFIG.throw, p = sq.group.position;
    api.setFocus(fs.mode === 'held' ? thr.group.position : p.clone().setY(0));
    if (fs.mode === 'held') { p.copy(handPos()); return; }
    if (fs.mode === 'caught') { p.copy(handsMid()); return; }
    if (dt <= 0) return;
    if (fs.vm && (fs.mode === 'in' || fs.mode === 'fly') && sq.group.scale.x < 1) { const VM = CONFIG.throw.viewmodel; sq.group.scale.setScalar(Math.min(1, sq.group.scale.x + (1 - VM.scale) * dt / VM.growTime)); }
    if (fs.mode === 'in') {
      const f = fs.flight, tau = Math.min(api.S.world - f.t0, f.T);
      p.copy(f.S).addScaledVector(f.v0, tau).add(new V3(0, -0.5 * f.g * tau * tau, 0));
      sq.face(f.v0.clone().add(new V3(0, -f.g * tau, 0)));
      return;
    }
    if (fs.mode === 'fly') {
      fs.vel.y -= (fs.bounced ? B.gravity : T.gravity) * dt;
      p.addScaledVector(fs.vel, dt);
      sq.face(fs.bounced ? new V3(fs.vel.x, 0, fs.vel.z) : fs.vel);
      if (p.y <= restY() && fs.vel.y < 0) {
        const vin = -fs.vel.y, h = Math.hypot(fs.vel.x, fs.vel.z);
        p.y = restY(); fs.contacts++;
        if (!fs.bounced) api.measure('flight', `Flight ${fs.from.distanceTo(p).toFixed(1)} studs · lands at ${vin.toFixed(1)} studs/s down, ${h.toFixed(1)} forward`);
        fs.bounced = true; sq.spinRate = 0; sq.spinAngle = 0; sq.base = [1, 1, 1];
        const out = vin * B.restitution + h * B.hopFromSpeed;
        fs.vel.x *= B.keepHorizontal; fs.vel.z *= B.keepHorizontal;
        api.signal(vin >= B.bigFrom ? 'bounceBig' : 'bounceSmall', {}); api.signal('bounce', {});
        if (out < B.rollBelow) { fs.mode = 'roll'; fs.vel.y = 0; fs.rollDir.set(fs.vel.x, 0, fs.vel.z).normalize(); fs.rollSpeed = Math.hypot(fs.vel.x, fs.vel.z); api.signal('roll', {}); }
        else fs.vel.y = out;
      }
      return;
    }
    if (fs.mode === 'roll') {
      const s0 = fs.rollSpeed, s1 = Math.max(0, s0 - B.rollDecel * dt), d = (s0 + s1) / 2 * dt;
      fs.rollSpeed = s1; p.addScaledVector(fs.rollDir, d); fs.rolled += d;
      sq.face(fs.rollDir); sq.spin.rotation.x = -fs.rolled / CONFIG.throw.radius;
      if (s1 <= 0) { fs.mode = 'rest'; api.measure('rest', `${fs.contacts} floor contacts · rolled ${fs.rolled.toFixed(1)} studs · rests ${fs.from.distanceTo(p).toFixed(1)} studs from the hand`); api.signal('rest', {}); }
    }
  },
  camera(api, view) {
    const C = CONFIG.camera;
    if (view === 'T1P') { const e = eyeOf(thr, 'thrower').add(new V3(0, 0, C.thrower.back)), k = C.thrower.pitch * api.DEG; return { pos: e, look: e.clone().add(new V3(0, Math.sin(k), -Math.cos(k))) }; }
    if (view === 'R1P') { const e = eyeOf(tgt, 'target').add(new V3(0, 0, -C.target.back)), k = C.target.pitch * api.DEG; return { pos: e, look: e.clone().add(new V3(0, Math.sin(k), Math.cos(k))) }; }
    return api.orbit('OBS', fs.obs, C.observer);
  },
  anchor(api, name) {
    switch (name) {
      case 'squishy': return { pos: sq.group.position.clone(), dir: api.UP, vel: fs.vel };
      case 'hand': return { pos: handPos(), dir: new V3(0, 0, -1) };
      case 'hands': return { pos: handsMid(), dir: api.UP };
      case 'floor': { const p = sq.group.position; return { pos: new V3(p.x, CONFIG.stage.floorLift, p.z), dir: api.UP }; }
    }
    return { pos: sq.group.position.clone(), dir: api.UP };
  },
  aim(api, name) {
    if (name === 'forward') return new V3(0, 0, -1);
    if (name === 'toThrower') return new V3(0, 0, 1);
    if (name === 'back') return fs.rollDir.lengthSq() ? fs.rollDir.clone().negate() : new V3(0, 0, 1);
    return null;
  },
  target(api, name) { return name === 'thrower' ? thr : name === 'squishy' ? sq : tgt; },
  motions: {
    throw(api, ev) {
      const T = CONFIG.throw, k = ev.pitch * api.DEG, speed = ev.kind === 'charged' ? T.speedCharged : T.speedTap;
      fs.mode = 'fly'; fs.from = sq.group.position.clone();
      fs.vel.set(0, Math.sin(k), -Math.cos(k)).multiplyScalar(speed);
      sq.spinRate = ev.kind === 'charged' ? T.spinCharged : T.spinTap;
      sq.base = [1, 1, 1];
    },
  },
  calls: {
    throwIn(api) {
      const T = CONFIG.throw; thr.update(0, 0);
      const S = handPos(), H = fs.catchAt, time = H.distanceTo(S) / T.speedTap;
      const v0 = H.clone().sub(S).divideScalar(time).add(new V3(0, 0.5 * T.gravity * time, 0));
      fs.flight = { S, v0, g: T.gravity, t0: api.S.world, T: time }; fs.mode = 'in';
      sq.group.position.copy(S); sq.spinRate = T.spinTap; sq.face(v0);
    },
    caught() { fs.mode = 'caught'; sq.spinRate = 0; sq.spinAngle = 0; sq.face(new V3(0, 0, 1)); },
    burst() { fs.mode = 'gone'; sq.group.visible = false; },
  },
});
</script>
