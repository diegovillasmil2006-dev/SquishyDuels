function chest(av) { return av.group.position.clone().add(new V3(0, CONFIG.stage.chestHeight, 0)); }

    const C = St.pillars, g = new THREE.BoxGeometry(C.size[0], C.size[1], C.size[2]);
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach((s, i) => {
      const m = new THREE.Mesh(g, api.material('pillar' + i, C.colors[i % C.colors.length], Vw.ground.roughness)); m.name = 'Pillar';
      m.position.set(P.center[0] + s[0] * (P.size[0] / 2 - C.inset), C.size[1] / 2, P.center[2] + s[1] * (P.size[2] / 2 - C.inset)); m.castShadow = true; api.scene.add(m);
    });
    atk = api.avatar({ name: 'Attacker', colors: CONFIG.avatars.attacker });
    vic = api.avatar({ name: 'Victim', colors: CONFIG.avatars.victim });
    const T = CONFIG.throwIn;
    sq = api.squishy({ name: 'Squishy', color: T.color, radius: T.radius });
    api.scene.add(atk.group, vic.group, sq.group);
  },
  reset(api, id, m) {
    Object.assign(ps, fresh());
    const vz = m.victimZ != null ? m.victimZ : CONFIG.stage.victimZ, T = CONFIG.throwIn;
    vic.group.position.set(0, 0, vz); vic.group.rotation.y = Math.PI;
    atk.group.position.set(0, 0, vz + T.distance); atk.group.rotation.y = 0;
    atk.setFirstPerson(api.S.view === 'A1P'); vic.setFirstPerson(api.S.view === 'V1P');
    const o = CONFIG.stage.hitOffset;
    ps.hit = new V3(vic.group.position.x + o[0], o[1], vz + o[2]);
    ps.spawn = vic.group.position.clone();
    ps.back = new V3(0, 0, 1);  // from victim toward attacker
    ps.aimA = chest(vic); ps.aimV = chest(atk);
    ps.mid = vic.group.position.clone().lerp(atk.group.position, 0.5).add(new V3(0, CONFIG.camera.observer.lookHeight, 0));
    const r = T.release; ps.start = atk.group.position.clone().add(new V3(r[0], r[1], r[2]));
    sq.group.position.copy(ps.start); sq.group.visible = true; sq.spinRate = 0;
  },
  update(api, dt) {
    api.setFocus(vic.group.position);
    if (dt <= 0) return;
    const W = CONFIG.world, K = CONFIG.knockback, St = CONFIG.stage;
    if (ps.flight) {
      const f = ps.flight, tau = Math.min(api.S.world - f.t0, f.T);
      sq.group.position.copy(f.S).addScaledVector(f.v0, tau).add(new V3(0, -0.5 * f.g * tau * tau, 0));
      sq.face(f.v0.clone().add(new V3(0, -f.g * tau, 0)));
      if (tau >= f.T) { ps.flight = null; sq.spinRate = 0; }
    }
    const p = vic.group.position;
    if (ps.flying) {
      ps.airT += dt;
      const v = ps.vel;
      v.y = Math.max(v.y - W.gravity * (v.y < 0 ? W.fallGravityMultiplier : 1) * dt, -W.maxFallSpeed);
      if (ps.hold > 0) ps.hold -= dt; else { const k = Math.exp(-K.airDrag * dt); v.x *= k; v.z *= k; }
      p.addScaledVector(v, dt);
      if (onPlatform(p) && p.y <= 0 && v.y < 0) {
        p.y = 0; v.y = 0; ps.flying = false; ps.grounded = true;
        api.measure('kb', `Knockback ${ps.kb.h.toFixed(1)} back + ${ps.kb.v.toFixed(1)} up studs/s · held ${ps.kb.hold} s · air ${ps.airT.toFixed(2)} s · landed ${ps.from.distanceTo(p).toFixed(1)} studs away`);
        api.signal('land', {});
      }
      if (!ps.offEdge && !onPlatform(p) && p.y < -St.offEdgeDepth) { ps.offEdge = true; api.signal('offEdge', {}); }
      if (!ps.killed && p.y < St.killY) { ps.killed = true; ps.flying = false; api.signal('killY', {}); }
    } else if (ps.grounded) {
      const h = Math.hypot(ps.vel.x, ps.vel.z);
      if (h > 0) { const k = Math.max(0, h - K.groundDecel * dt) / h; ps.vel.x *= k; ps.vel.z *= k; p.addScaledVector(new V3(ps.vel.x, 0, ps.vel.z), dt); }
    }
  },
  camera(api, view, dtR) {
    if (view === 'A1P') return { pos: eye(atk), look: ps.aimA };
    if (view === 'V1P') {
      const c = ps.cam;
      if (c && c.mode === 'ko') {
        const K = CONFIG.camera.koCam, e = api.ease(K.Easing, (api.S.t - c.t0) / K.Time);
        return { pos: c.from.clone().lerp(c.to, e), look: c.fromLook.clone().lerp(ps.poofAt || chest(vic), e) };
      }
      if (c && c.mode === 'fall') {
        c.look.lerp(chest(vic), 1 - Math.exp(-CONFIG.camera.fallCam.FollowRate * dtR));
        return { pos: c.pos, look: c.look };
      }
      const e = eye(vic); return { pos: e, look: e.clone().add(ps.back) };
    }
    return api.orbit('OBS', ps.mid, CONFIG.camera.observer);
  },
  anchor(api, name) {
    switch (name) {
      case 'hit': return { pos: ps.hit.clone(), dir: ps.back };
      case 'squishy': return { pos: sq.group.position.clone() };
      case 'victimFeet': return { pos: vic.group.position.clone().add(new V3(0, CONFIG.stage.feetLift, 0)), dir: api.UP };
      case 'victimChest': return { pos: chest(vic), dir: ps.back };
      case 'spawnFeet': return { pos: ps.spawn.clone(), dir: api.UP };
    }
    return { pos: vic.group.position.clone(), dir: api.UP };
  },
  aim(api, name) { return name === 'back' ? ps.back : null; },
  target(api, name) { return name === 'attacker' ? atk : name === 'squishy' ? sq : vic; },
  motions: {
    knockback(api, ev) {
      const K = CONFIG.knockback, base = K[ev.kind === 'ultimate' ? 'normal' : ev.kind], mul = ev.kind === 'ultimate' ? K.ultimateMultiplier : 1;
      const away = ps.back.clone().negate();
      ps.kb = { h: base.horizontal * mul, v: base.vertical * mul, hold: base.hold };
      ps.vel.copy(away.multiplyScalar(ps.kb.h)).add(new V3(0, ps.kb.v, 0));
      ps.hold = base.hold; ps.flying = true; ps.grounded = false; ps.airT = 0; ps.from = vic.group.position.clone();
    },
  },
  calls: {
    throwIn(api) {
      const T = CONFIG.throwIn, H = ps.hit, S = ps.start, D = H.distanceTo(S), time = D / T.speed;
      const v0 = H.clone().sub(S).divideScalar(time).add(new V3(0, 0.5 * T.gravity * time, 0));
      ps.flight = { S, v0, g: T.gravity, t0: api.S.world, T: time };
      sq.spinRate = T.spinRate; sq.face(v0);
    },
    hideSquishy() { sq.group.visible = false; },
    hideVictim() { ps.poofAt = chest(vic); vic.group.visible = false; },
    poof(api) { api.signal('poof', {}); },
    koCam(api) {
      const K = CONFIG.camera.koCam, side = new V3().crossVectors(ps.back, api.UP).normalize();
      vic.setFirstPerson(false);
      ps.cam = { mode: 'ko', t0: api.S.t, from: eye(vic), fromLook: eye(vic).add(ps.back),
        to: ps.hit.clone().addScaledVector(ps.back, K.Back).add(new V3(0, K.Up, 0)).addScaledVector(side, K.Side) };
    },
    fallCam(api) { vic.setFirstPerson(false); ps.cam = { mode: 'fall', pos: new V3(vic.group.position.x, CONFIG.camera.firstPerson.eyeHeight, vic.group.position.z).addScaledVector(ps.back, CONFIG.stage.offEdgeDepth), look: chest(vic) }; },
    respawn(api) {
      ps.cam = null; ps.flying = false; ps.grounded = true; ps.vel.set(0, 0, 0);
      vic.group.position.copy(ps.spawn); vic.group.visible = true; vic.setFirstPerson(api.S.view === 'V1P'); vic.stop();
    },
  },
});
</script>
<script src="squishy-kit.js"></script>
<script src="squishy-fx.js"></script>
</head>
