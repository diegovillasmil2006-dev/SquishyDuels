      out = { pos: new V3(p.x, p.y + o.Up, p.z + o.Back), look: new V3(p.x, p.y + C.LookHeight, p.z - o.LookAhead), fov: o.Fov };
      if (flying) {
        const roll = C.Bank.Degrees * k * Math.sin(api.TAU * C.Bank.Hz * (api.S.world - hs.t0)) * (api.S.reduce ? CONFIG.reduceMotion.bank : 1) * DEG;
        out.up = api.UP.clone().applyAxisAngle(out.look.clone().sub(out.pos).normalize(), roll);
      }
      if (hs.hero) {
        const Hh = C.Hero, e = api.ease(Hh.Easing, (api.S.t - hs.hero) / Hh.Time);
        out = { pos: out.pos.lerp(new V3(p.x + Hh.Side, p.y + Hh.Up, p.z - Hh.Front), e), look: out.look.lerp(p.clone(), e), fov: out.fov + (Hh.Fov - out.fov) * e };
      }
    }
    const z = hs.zone || CONFIG.zones[0], b = 1 - Math.exp(-SK.blendRate * dtR);
    skyTop.lerp(tmpC.set(z.sky[0]), b); skyHor.lerp(tmpC.set(z.sky[1]), b);
    skyMat.uniforms.top.value.copy(skyTop); skyMat.uniforms.horizon.value.copy(skyHor); api.scene.fog.color.copy(skyHor);
    dome.position.copy(out.pos);
    return out;
  },
  anchor(api, name, data, ev) {
    const p = sq.group.position, o = ev && ev.offset;
    if (name === 'floor') return { pos: new V3(p.x, CONFIG.stage.floorLift, p.z), dir: api.UP };
    if (name === 'feet') { const f = thr.group.position; return { pos: new V3(f.x, CONFIG.stage.floorLift, f.z), dir: api.UP }; }
    if (name === 'band') return { pos: new V3(p.x + o, p.y, p.z), side: new V3(1, 0, 0) };
    const pos = p.clone(); if (Array.isArray(o)) pos.add(new V3(o[0], o[1], o[2]));
    return { pos, dir: api.UP, vel: hs.vel };
  },
  aim(api, name) {
    if (name === 'forward') return new V3(0, 0, -1);
    if (name === 'back') return new V3(0, 0, 1);
    return null;
  },
  target(api, name) { return name === 'thrower' ? thr : sq; },
  readout(api, name) { return { value: hs.start ? Math.max(0, hs.start.z - sq.group.position.z) : 0, done: hs.mode === 'done' }; },
  motions: {
    launch(api) {
      const H = CONFIG.highway;
      hs.start = sq.group.position.clone();
      hs.sol = solve(hs.D, hs.start.y); hs.t0 = api.S.world; hs.mode = 'path'; hs.zone = null;
      sq.spinRate = H.spinRate;
      marker.position.set(hs.start.x + CONFIG.stage.stopMarker.radius, 0, hs.start.z - hs.D); marker.visible = true;
      const s = hs.sol;
      api.measure('plan', `D ${hs.D.toLocaleString()} = flight ${s.F.toFixed(1)} + bounces ${s.B.map(b => b.toFixed(1)).join(' + ')} + roll ${s.R.toFixed(1)} studs`);
      api.measure('arc', `Flight ${s.T.toFixed(2)} s · apex ${s.maxY.toFixed(1)} studs (max ${H.maxHeight}) · avg ${(s.F / s.T).toFixed(0)} studs/s · total ${s.total.toFixed(2)} s`);
      if (hs.D >= H.sonicFrom) api.signal('sonic', {});
    },
  },
  calls: {
    zoneTrail(api) { startTrail(api, zoneAt(0)); },
    zoneFx(api, ev, data) {
      const z = data.zone, F = CONFIG.fx, pos = sq.group.position.clone();
      api.ring(Object.assign({}, F.zoneRing, { Color: z.color }), pos, new V3(0, 0, -1), LOCK);
      api.burst(Object.assign({}, F.zoneSparkles, { Tints: [z.color] }), pos, api.UP, null, LOCK);
      startTrail(api, z);
      api.measure('zone', `Entered ${z.name} at ${z.start.toLocaleString()} studs`);
    },
    endTrail(api) { if (hs.trailName) api.stopNamed(hs.trailName); },
    heroCam(api) { hs.hero = api.S.t; },
  },
});
</script>

<script src="squishy-fx.js"></script>
