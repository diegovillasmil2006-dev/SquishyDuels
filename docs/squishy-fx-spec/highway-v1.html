    ui: { bg: '#FFF4E6', panel: '#FFFFFF', ink: '#3B2A35', muted: '#76656F', line: '#EADBCB', accent: '#FFC7DA', accentSoft: '#FFE6EE', accentInk: '#B83E70', good: '#23805F', bad: '#C23B5A', stage: '#CFE8FF', refHeight: 1080, sfxHold: 1.1, sfxFade: 0.35, sfxMax: 6 },
  },
};

/* ------------------------------- page logic (no numbers) ------------------------------- */
const V3 = THREE.Vector3;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
let thr, sq, marker, custom = CONFIG.highway.customDefault;
const hs = {};

function restY() { return CONFIG.highway.radius * CONFIG.viewer.squishy.restSquash; }
// Splits D into flight + bounces + roll; every piece is measured along the road from the release point.
function solve(D, y0) {
  const P = CONFIG.solver, g = CONFIG.world.gravity, ry = restY();
  const n = D >= P.threeBouncesFrom ? 3 : D >= P.twoBouncesFrom ? 2 : 1;
  const B = [], Hb = [];
  let b = clamp(D * P.firstBounceShare, P.firstBounceMin, P.firstBounceMax);
  for (let i = 0; i < n; i++) { B.push(b); b *= P.bounceLengthKeep; }
  const R = clamp(D * P.rollShare, P.rollMin, P.rollMax);
  const F = D - B.reduce((a, x) => a + x, 0) - R;
  const H = clamp(F * P.apexShare, P.apexMin, CONFIG.highway.maxHeight - y0);
  const T = clamp(P.timeBase + P.timePerSqrtStud * Math.sqrt(F), P.timeMin, P.timeMax);
  let h = clamp(H * P.firstBounceHeightShare, P.bounceHeightMin, P.bounceHeightMax);
  for (let i = 0; i < n; i++) { Hb.push(h); h *= P.bounceHeightKeep; }
  const segs = [{ kind: 'flight', t0: 0, t1: T, s0: 0, s1: F, H, y0, ry }];
  let t = T, s = F;
  for (let i = 0; i < n; i++) { const tb = 2 * Math.sqrt(2 * Hb[i] / g); segs.push({ kind: 'bounce', i, t0: t, t1: t + tb, s0: s, s1: s + B[i], h: Hb[i], ry }); t += tb; s += B[i]; }
  const vLast = B[n - 1] / (segs[n].t1 - segs[n].t0), v0 = vLast * P.rollEntryKeep, tr = 2 * R / v0;
  segs.push({ kind: 'roll', t0: t, t1: t + tr, s0: s, s1: s + R, v0, a: v0 / tr, ry });
  let maxY = 0; for (let k = 0; k <= 1; k += 1 / 512) maxY = Math.max(maxY, flightY(segs[0], k));
  return { D, n, B, Hb, R, F, H, T, segs, total: t + tr, maxY };
}
function flightY(sg, p) { return sg.ry + (sg.y0 - sg.ry) * (1 - p) + 4 * sg.H * p * (1 - p); }
// position along the road (s), height (y) and their speeds at path time t
function sample(sol, t) {
  const L = CONFIG.solver.linearShare;
  const sg = sol.segs.find(x => t < x.t1) || sol.segs[sol.segs.length - 1];
  const tt = Math.min(Math.max(t, sg.t0), sg.t1);
  if (sg.kind === 'flight') {
    const u = (tt - sg.t0) / (sg.t1 - sg.t0), F = sg.s1 - sg.s0;
    const s = F * (L * u + (1 - L) * (1 - (1 - u) * (1 - u))), ds = F / (sg.t1 - sg.t0) * (L + 2 * (1 - L) * (1 - u)), p = s / F;
    return { sg, s, y: flightY(sg, p), ds, dy: (-(sg.y0 - sg.ry) + 4 * sg.H * (1 - 2 * p)) * ds / F };
  }
  if (sg.kind === 'bounce') {
    const d = sg.t1 - sg.t0, u = (tt - sg.t0) / d;
    return { sg, s: sg.s0 + (sg.s1 - sg.s0) * u, y: sg.ry + 4 * sg.h * u * (1 - u), ds: (sg.s1 - sg.s0) / d, dy: 4 * sg.h * (1 - 2 * u) / d };
  }
  const tau = tt - sg.t0;
  return { sg, s: sg.s0 + sg.v0 * tau - 0.5 * sg.a * tau * tau, y: sg.ry, ds: Math.max(0, sg.v0 - sg.a * tau), dy: 0 };
}
function zoneAt(s) { let z = CONFIG.zones[0]; for (const x of CONFIG.zones) if (s >= x.start) z = x; return z; }
function textSprite(api, text, color) {
  const L = CONFIG.viewer.label, c = document.createElement('canvas'); c.width = L.w; c.height = L.h;
  const g = c.getContext('2d'); g.font = `700 ${L.font}px Fredoka, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = L.stroke; g.strokeStyle = CONFIG.viewer.colors.ink; g.strokeText(text, L.w / 2, L.h / 2); g.fillStyle = color; g.fillText(text, L.w / 2, L.h / 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true })); s.name = 'ZoneLabel'; return s;
}

SquishyFX(THREE, CONFIG, {
  setup(api) {
    const St = CONFIG.stage, H = CONFIG.highway, Vw = CONFIG.viewer, Z = CONFIG.zones, end = H.maxDistance + St.margin;
    Z.forEach((z, i) => {
      const z1 = i + 1 < Z.length ? Z[i + 1].start : end, len = z1 - z.start + (i === 0 ? St.startBack : 0);
      const gnd = new THREE.Mesh(new THREE.PlaneGeometry(St.groundWidth, len), api.material('ground_' + i, z.ground, Vw.ground.roughness));
      gnd.name = 'Zone_' + z.name; gnd.rotation.x = -Math.PI / 2; gnd.position.set(0, 0, -(z.start + z1) / 2 + (i === 0 ? St.startBack / 2 : 0)); gnd.receiveShadow = true; api.scene.add(gnd);
      if (i > 0) {
        const A = St.arch, m = api.material('arch_' + i, z.color, Vw.ground.roughness);
        for (const s of [-1, 1]) { const p = new THREE.Mesh(new THREE.BoxGeometry(A.pillar[0], A.pillar[1], A.pillar[2]), m); p.name = 'ArchPillar'; p.position.set(s * A.bar[0] / 2, A.pillar[1] / 2, -z.start); p.castShadow = true; api.scene.add(p); }
        const bar = new THREE.Mesh(new THREE.BoxGeometry(A.bar[0] + A.pillar[0], A.bar[1], A.bar[2]), m); bar.name = 'ArchBar'; bar.position.set(0, A.height, -z.start); api.scene.add(bar);
        const lab = textSprite(api, z.name, z.color); lab.scale.set(A.labelSize[0], A.labelSize[1], 1); lab.position.set(0, A.labelHeight, -z.start); api.scene.add(lab);
      }
    });
    const road = new THREE.Mesh(new THREE.PlaneGeometry(St.roadWidth, end + St.startBack), api.material('road', St.roadColor, Vw.ground.roughness));
    road.name = 'Road'; road.rotation.x = -Math.PI / 2; road.position.set(0, St.floorLift / 2, -(end - St.startBack) / 2); road.receiveShadow = true; api.scene.add(road);
    const P = St.posts, count = Math.ceil(end / P.every), inst = new THREE.InstancedMesh(new THREE.BoxGeometry(P.size[0], P.size[1], P.size[2]), new THREE.MeshStandardMaterial({ name: 'post', roughness: Vw.ground.roughness }), count * 2);
    inst.name = 'Posts'; const m4 = new THREE.Matrix4(), c = new THREE.Color();
    for (let i = 0; i < count; i++) for (const s of [0, 1]) {
      const zz = i * P.every; m4.makeTranslation((s ? 1 : -1) * P.offsetX, P.size[1] / 2, -zz); inst.setMatrixAt(i * 2 + s, m4); inst.setColorAt(i * 2 + s, c.set(zoneAt(zz).color));
    }
    inst.castShadow = true; api.scene.add(inst);
    const M = St.stopMarker; marker = new THREE.Group(); marker.name = 'StopMarker (preview)';
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(M.pole, M.pole, M.height), api.material('marker', M.color, Vw.ground.roughness)); pole.position.y = M.height / 2; marker.add(pole);
    api.scene.add(marker);
    thr = api.avatar({ name: 'Player', colors: CONFIG.avatars.thrower });
    sq = api.squishy({ name: 'Squishy', color: H.color, radius: H.radius });
    api.scene.add(thr.group, sq.group);
    api.el.extra.innerHTML = `<div class="sq-label">Custom distance</div><label class="sq-slider"><span>D = <b id="hw-d"></b> studs</span><input id="hw-range" type="range" min="${H.minDistance}" max="${H.maxDistance}" step="${H.customStep}" value="${custom}"></label><button class="sq-btn" id="hw-go"><span>Throw custom</span><span class="k">C</span></button>`;
    const r = api.el.extra.querySelector('#hw-range'), d = api.el.extra.querySelector('#hw-d');
    d.textContent = custom.toLocaleString();
    r.oninput = () => { custom = +r.value; d.textContent = custom.toLocaleString(); };
    r.onchange = () => api.play('custom');
    api.el.extra.querySelector('#hw-go').onclick = () => api.play('custom');
    window.addEventListener('keydown', e => { if (e.key === 'c' || e.key === 'C') api.play('custom'); });
  },
  validate(api, ok) {
    const H = CONFIG.highway; thr.update(0, 0); const y0 = handPos().y;
    for (const D of [H.minDistance, H.maxDistance]) {
      const s = solve(D, y0), end = sample(s, s.total);
      ok(s.F > 0, `solver ${D}: flight length ${s.F.toFixed(1)} > 0`);
      ok(s.maxY <= H.maxHeight, `solver ${D}: apex ${s.maxY.toFixed(1)} ≤ ${H.maxHeight} studs`);
      ok(Math.abs(end.s - D) < 1e-6, `solver ${D}: ends exactly on D`);
    }
  },
  reset(api, id, m) {
    Object.assign(hs, { mode: 'held', sol: null, t0: 0, zone: null, apexSent: false, contact: 0, lastFast: -Infinity, trailName: null, hero: null, off: null, D: m.distance != null ? m.distance : custom });
    thr.group.position.set(0, 0, 0); thr.group.rotation.y = 0;
    sq.group.visible = true; sq.spin.rotation.set(0, 0, 0);
    thr.update(0, 0); sq.group.position.copy(handPos()); sq.face(new V3(0, 0, -1));
    marker.visible = false;
  },
  update(api, dt, dtR) {
    const p = sq.group.position;
    api.setFocus(new V3(p.x, 0, p.z));
    if (hs.mode === 'held') { p.copy(handPos()); return; }
    if (hs.mode !== 'path' || dt <= 0) return;
    const sol = hs.sol, t = api.S.world - hs.t0, smp = sample(sol, t);
    p.set(hs.start.x, smp.y, hs.start.z - smp.s);
    const speed = Math.hypot(smp.ds, smp.dy); hs.speed = speed;
    const z = zoneAt(smp.s);
    if (z !== hs.zone) { const first = !hs.zone; hs.zone = z; if (!first) api.signal('zone', { zone: z }); }
    if (smp.sg.kind === 'flight') {
      sq.face(new V3(0, smp.dy, -smp.ds));
      if (!hs.apexSent && smp.dy <= 0) { hs.apexSent = true; api.signal('apex', {}); }
      if (speed >= CONFIG.highway.fastFrom && api.S.t - hs.lastFast >= CONFIG.highway.fastLinesEvery) { hs.lastFast = api.S.t; api.signal('fast', {}); }
    } else { sq.face(new V3(0, 0, -1)); sq.spinRate = 0; sq.spinAngle = 0; }
    const segIdx = sol.segs.indexOf(smp.sg);
    while (hs.contact < segIdx) {
      hs.contact++;
      const k = sol.segs[hs.contact];
      if (k.kind === 'bounce') { api.signal(k.i === 0 ? 'bounce1' : 'bounceN', {}); if (k.i === sol.n - 1) api.signal('lastBounce', {}); }
      if (k.kind === 'roll') api.signal('roll', {});
    }
    if (smp.sg.kind === 'roll') { const rolled = smp.s - smp.sg.s0; sq.spin.rotation.x = -rolled / CONFIG.highway.radius; }
    if (t >= sol.total && hs.mode === 'path') {
      hs.mode = 'done';
      const err = Math.abs(hs.start.z - p.z - hs.D);
      api.measure('end', `Stop: target ${hs.D.toLocaleString()} studs · actual ${(hs.start.z - p.z).toFixed(3)} · error ${err.toFixed(3)} studs`);
      api.signal('stop', {});
    }
  },
  camera(api, view, dtR) {
    const p = sq.group.position;
    if (view === 'SIDE') return api.orbit('SIDE', p.clone(), CONFIG.sideCam);
    const C = CONFIG.chaseCam;
    let target;
    if (hs.mode === 'held') target = C.Launch;
    else if (hs.mode === 'path' && hs.sol && api.S.world - hs.t0 < hs.sol.T) { const k = clamp((hs.speed - C.SpeedLow) / (C.SpeedHigh - C.SpeedLow), 0, 1); target = { Back: C.Launch.Back + (C.Fast.Back - C.Launch.Back) * k, Up: C.Launch.Up + (C.Fast.Up - C.Launch.Up) * k, LookAhead: C.Launch.LookAhead + (C.Fast.LookAhead - C.Launch.LookAhead) * k, Fov: C.Launch.Fov + (C.Fast.Fov - C.Launch.Fov) * k }; }
    else target = C.Ground;
    if (!hs.off) hs.off = Object.assign({}, C.Launch);
    const a = 1 - Math.exp(-C.FollowRate * dtR);
    for (const k of ['Back', 'Up', 'LookAhead', 'Fov']) hs.off[k] += (target[k] - hs.off[k]) * a;
    const o = hs.off, chase = { pos: new V3(p.x, p.y + o.Up, p.z + o.Back), look: new V3(p.x, p.y + C.LookHeight, p.z - o.LookAhead), fov: o.Fov };
    if (hs.hero) {
      const Hh = C.Hero, e = api.ease(Hh.Easing, (api.S.t - hs.hero) / Hh.Time);
      const heroPos = new V3(p.x + Hh.Side, p.y + Hh.Up, p.z - Hh.Front);
      return { pos: chase.pos.lerp(heroPos, e), look: chase.look.lerp(p.clone(), e), fov: chase.fov + (Hh.Fov - chase.fov) * e };
    }
    return chase;
  },
  anchor(api, name) {
    const p = sq.group.position;
    if (name === 'floor') return { pos: new V3(p.x, CONFIG.stage.floorLift, p.z), dir: api.UP };
    return { pos: p.clone(), dir: api.UP };
  },
  aim(api, name) {
    if (name === 'forward') return new V3(0, 0, -1);
    if (name === 'back') return new V3(0, 0, 1);
    return null;
  },
  target(api, name) { return name === 'thrower' ? thr : sq; },
  motions: {
    launch(api) {
      hs.start = sq.group.position.clone();
      hs.sol = solve(hs.D, hs.start.y); hs.t0 = api.S.world; hs.mode = 'path'; hs.zone = null;
      sq.spinRate = CONFIG.highway.spinRate;
      marker.position.set(hs.start.x + CONFIG.stage.stopMarker.radius, 0, hs.start.z - hs.D); marker.visible = true;
      const s = hs.sol;
      api.measure('plan', `D ${hs.D.toLocaleString()} = flight ${s.F.toFixed(1)} + bounces ${s.B.map(b => b.toFixed(1)).join(' + ')} + roll ${s.R.toFixed(1)} studs`);
      api.measure('arc', `Flight ${s.T.toFixed(2)} s · apex ${s.maxY.toFixed(1)} studs (max ${CONFIG.highway.maxHeight}) · avg ${(s.F / s.T).toFixed(0)} studs/s · total ${s.total.toFixed(2)} s`);
    },
  },
  calls: {
    zoneTrail(api) { startTrail(api, zoneAt(0)); },
    zoneFx(api, ev, data) {
      const z = data.zone, F = CONFIG.fx;
      api.ring(Object.assign({}, F.zoneRing, { Color: z.color }), sq.group.position.clone(), new V3(0, 0, -1));
      api.burst(Object.assign({}, F.zoneSparkles, { Tints: [z.color] }), sq.group.position.clone(), api.UP);
      startTrail(api, z);
      api.measure('zone', `Entered ${z.name} at ${z.start.toLocaleString()} studs`);
    },
    endTrail(api) { if (hs.trailName) api.stopNamed(hs.trailName); },
    heroCam(api) { hs.hero = api.S.t; },
  },
});
function handPos() { const h = thr.parts.RightHand.getWorldPosition(new V3()), o = CONFIG.stage.holdOffset; return h.add(new V3(o[0], o[1], o[2])); }
function startTrail(api, z) {
  if (hs.trailName) api.stopNamed(hs.trailName);
  hs.trailName = 'trail_' + z.name;
  const F = CONFIG.fx.flightTrail;
  api.trailOn(Object.assign({}, F, { Color: [[0, z.color], [1, F.TrailEnd]] }), { trail: hs.trailName, at: 'squishy' }, {});
}
