/* ------------------------------- page logic (no numbers) ------------------------------- */
const V3 = THREE.Vector3;
let av;
const st = {};
function fresh() { return { t: 0, vy: 0, grounded: true, hspeed: 0, cut: true, cutAt: 0, second: null, apexSent: true, fastSent: false, dashT: -1, slideT: -1, stopAt: Infinity, stopOnLand: false, startY: 0, maxY: 0, from: null, walk: 0 }; }
function floorAt(p) {
  const L = CONFIG.stage.ledge;
  return Math.abs(p.x - L.center[0]) <= L.size[0] / 2 && Math.abs(p.z - L.center[2]) <= L.size[2] / 2 ? L.size[1] : 0;
}
function walkFor(api, m) {
  const k = m.walk || (api.S.view === '1P' ? 'duel' : 'lobby');
  return k === 'duel' ? CONFIG.world.walkSpeedDuel : CONFIG.world.walkSpeedLobby;
}
function land(api, impact) {
  const F = CONFIG.feel, p = av.group.position;
  st.grounded = true; st.vy = 0; st.cut = true; st.second = null;
  if (st.stopOnLand) st.hspeed = 0;
  const tier = impact < F.landSoftBelow ? 'Soft' : impact >= F.landHardFrom ? 'Hard' : 'Normal';
  api.measure('land', `Rise ${(st.maxY - st.startY).toFixed(2)} studs · drop ${(st.maxY - p.y).toFixed(2)} studs · lands at ${impact.toFixed(1)} studs/s → ${tier.toLowerCase()} tier`);
  api.signal('land', { impact });
  api.signal('land' + tier, { impact });
}

SquishyFX(THREE, CONFIG, {
  setup(api) {
    const Vw = CONFIG.viewer, Sg = CONFIG.stage;
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(Vw.ground.size, Vw.ground.size), new THREE.MeshStandardMaterial({ name: 'ground', map: api.checker(Vw.colors.groundA, Vw.colors.groundB, Vw.ground.size / Vw.ground.tile), roughness: Vw.ground.roughness }));
    ground.name = 'Ground'; ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; api.scene.add(ground);
    const L = Sg.ledge;
    const ledge = new THREE.Mesh(new THREE.BoxGeometry(L.size[0], L.size[1], L.size[2]), api.material('ledge', Vw.colors.ledge, Vw.ground.roughness));
    ledge.name = 'Ledge'; ledge.position.set(L.center[0], L.size[1] / 2, L.center[2]); ledge.castShadow = true; ledge.receiveShadow = true; api.scene.add(ledge);
    const P = Sg.posts, geo = new THREE.BoxGeometry(P.size[0], P.size[1], P.size[2]);
    const mats = P.colors.map((c, i) => api.material('post' + i, c, Vw.ground.roughness));
    for (let i = 0; i < P.count; i++) for (const s of [-1, 1]) {
      const m = new THREE.Mesh(geo, mats[i % mats.length]); m.name = 'Post';
      m.position.set(s * P.offsetX, P.size[1] / 2, P.start - i * P.every); m.castShadow = true; api.scene.add(m);
    }
    av = api.avatar({ name: 'Player', colors: Vw.avatar });
    api.scene.add(av.group);
  },
  reset(api, id, m) {
    Object.assign(st, fresh());
    const s = m.start === 'ledge' ? CONFIG.stage.ledgeStart : CONFIG.stage.laneStart;
    av.group.position.set(s[0], s[1], s[2]); av.group.rotation.y = 0;
    av.setFirstPerson(api.S.view === '1P');
    st.walk = walkFor(api, m);
    if (m.start === 'running') { st.hspeed = st.walk; av.loco = 'run'; }
    st.startY = st.maxY = s[1];
  },
  update(api, dt) {
    const p = av.group.position, F = CONFIG.feel, W = CONFIG.world, g = W.gravity;
    api.setFocus(p);
    if (dt <= 0) return;
    st.t += dt;
    let speed = st.hspeed, move = st.hspeed * dt, ended = null;
    if (st.dashT >= 0) {
      const T = F.dashTime, v1 = F.dashEndSpeed, v0 = 2 * F.dashDistance / T - v1, s = t => v0 * t + (v1 - v0) * t * t / (2 * T);
      const t1 = Math.min(T, st.dashT + dt); move = s(t1) - s(st.dashT); speed = v0 + (v1 - v0) * t1 / T; st.dashT = t1;
      if (t1 >= T) { st.dashT = -1; st.hspeed = v1; st.stopAt = st.t + CONFIG.stage.runAfterDash; ended = 'dash'; }
    } else if (st.slideT >= 0) {
      const T = F.slideTime, v = u => F.slideStartSpeed + (F.slideEndSpeed - F.slideStartSpeed) * api.ease(F.slideEasing, u);
      const t1 = Math.min(T, st.slideT + dt); move = (v(st.slideT / T) + v(t1 / T)) / 2 * (t1 - st.slideT); speed = v(t1 / T); st.slideT = t1;
      if (t1 >= T) { st.slideT = -1; st.hspeed = st.walk; st.stopAt = st.t + CONFIG.stage.runAfterSlide; ended = 'slide'; }
    }
    p.z -= move;
    if (ended === 'dash') { api.measure('dash', `Dash ${st.from.distanceTo(p).toFixed(2)} studs in ${F.dashTime} s · ${(2 * F.dashDistance / F.dashTime - F.dashEndSpeed).toFixed(1)} → ${F.dashEndSpeed} studs/s`); api.signal('dashEnd', {}); }
    if (ended === 'slide') { api.measure('slide', `Slide ${st.from.distanceTo(p).toFixed(2)} studs in ${F.slideTime} s · ${F.slideStartSpeed} → ${F.slideEndSpeed} studs/s (${F.slideEasing})`); api.signal('slideEnd', {}); }
    if (st.t >= st.stopAt) { st.hspeed = 0; st.stopAt = Infinity; api.signal('stop', {}); }
    if (!st.grounded) {
      if (!st.cut && st.t >= st.cutAt) { st.cut = true; if (st.vy > 0) st.vy *= F.jumpCutKeep; }
      if (st.second != null && st.t >= st.second) { st.second = null; st.vy = Math.sqrt(2 * g * W.doubleJumpHeight); st.apexSent = false; api.signal('double', {}); }
      const prev = st.vy;
      st.vy = Math.max(st.vy - g * (st.vy < 0 ? F.fallGravityMultiplier : 1) * dt, -F.maxFallSpeed);
      if (prev > 0 && st.vy <= 0 && !st.apexSent) { st.apexSent = true; api.signal('apex', {}); }
      if (!st.fastSent && st.vy <= -F.fastFallFrom) { st.fastSent = true; api.signal('fastFall', {}); }
      p.y += (prev + st.vy) / 2 * dt; st.maxY = Math.max(st.maxY, p.y);
      const fl = floorAt(p);
      if (p.y <= fl) { p.y = fl; land(api, -st.vy); }
    } else if (p.y > floorAt(p) + CONFIG.stage.edgeEps) { st.grounded = false; st.vy = 0; api.signal('fall', {}); }
    const moving = st.hspeed > 0 || st.dashT >= 0 || st.slideT >= 0;
    av.loco = !st.grounded ? 'air' : moving ? 'run' : 'idle';
    if (av.loco === 'run') {
      const before = Math.floor(av.phase / Math.PI);
      av.phase += dt * CONFIG.viewer.loco.strideHz * api.TAU * (speed / st.walk);
      const after = Math.floor(av.phase / Math.PI);
      if (after !== before && st.slideT < 0 && st.dashT < 0) api.signal('step', { foot: after % 2 ? 'Left' : 'Right' });
    }
  },
  camera(api, view) {
    const p = av.group.position, C = CONFIG.camera;
    if (view === '1P') {
      const eye = new V3(p.x, p.y + C.firstPerson.eyeHeight, p.z), k = C.firstPerson.pitch * api.DEG;
      return { pos: eye, look: eye.clone().add(new V3(0, Math.sin(k), -Math.cos(k))) };
    }
    return api.orbit('3P', new V3(p.x, p.y + C.thirdPerson.lookHeight, p.z), C.thirdPerson);
  },
  anchor(api, name, data) {
    const p = av.group.position, Sg = CONFIG.stage, wp = o => o.getWorldPosition(new V3());
    switch (name) {
      case 'feet': return { pos: new V3(p.x, p.y + Sg.feetLift, p.z), dir: api.UP };
      case 'chest': return { pos: new V3(p.x, p.y + Sg.chestHeight, p.z), dir: api.UP };
      case 'backFoot': return { pos: wp(av.parts.RightFoot), dir: api.UP };
      case 'stepFoot': return { pos: wp(av.parts[(data.foot || 'Right') + 'Foot']), dir: api.UP };
      case 'leadFoot': return { pos: wp(av.parts.LeftFoot), dir: api.UP };
      case 'leftShoulder': return { pos: wp(av.joints.LeftShoulder) };
      case 'rightShoulder': return { pos: wp(av.joints.RightShoulder) };
      case 'slideGround': return { pos: new V3(p.x, p.y + Sg.groundLift, p.z), side: new V3(1, 0, 0) };
    }
    return { pos: p.clone(), dir: api.UP };
  },
  aim(api, name) {
    const k = CONFIG.stage.backUpAngle * api.DEG;
    if (name === 'back') return new V3(0, 0, 1);
    if (name === 'forward') return new V3(0, 0, -1);
    if (name === 'backUp') return new V3(0, Math.sin(k), Math.cos(k));
    return null;
  },
  target() { return av; },
  motions: {
    run(api, ev) { st.hspeed = st.walk; st.stopAt = st.t + ev.for; },
    jump(api, ev) {
      const F = CONFIG.feel, W = CONFIG.world;
      st.grounded = false; st.vy = Math.sqrt(2 * W.gravity * W.jumpHeight);
      st.cut = false; st.cutAt = st.t + Math.max(ev.hold, F.jumpCutMinHold);
      st.second = ev.second != null ? st.t + ev.second : null;
      st.apexSent = false; st.fastSent = false; st.stopOnLand = true; st.startY = st.maxY = av.group.position.y;
    },
    dash() { st.dashT = 0; st.from = av.group.position.clone(); },
    slide() { st.slideT = 0; st.from = av.group.position.clone(); },
    ledgeFall() { st.hspeed = st.walk; st.stopOnLand = true; st.startY = st.maxY = av.group.position.y; },
  },
});
</script>
