  toy.scale.setScalar(0.001); toy.position.set(0, 0.8, 0); toy.visible = false; scene.add(toy);
  camera.position.set(0, 2.3, 8.4); controls.target.set(0, 1.05, 0); controls.enabled = false; controls.autoRotate = false; controls.update();
  renderer.domElement.classList.remove('grab');
  Object.assign(sp, { sq: 1, sqv: 0, lid: 0, lidv: 0, lidT: 0, hop: 0, hopv: 0 }); lidFly = null;

}
function seamPoint() { return V3(0, box.root.position.y + box.top + 0.05, 0); }
function tap() {

  inner.intensity = 3 + taps * 4;
  spawn(seamPoint(), 14 + taps * 10, { colors: box.parts, speed: 3 + taps, up: 1, cone: 0.8, life: 0.9, spread: 1.2, grav: 5 });
  if (box.ears) box.ears.forEach((e, i) => e.rotation.x = (i ? 1 : -1) * 0.5);

  if (taps >= 3) burst();
}
function burst() {
  S = 'open'; t = 0; toy.visible = true;
  inner.intensity = 10; beam.material.opacity = 0.5; beam.scale.set(0.2, 0.01, 0.2); waveT = 0;
  const p = seamPoint();
  spawn(p, 120, { colors: box.parts, speed: 7, up: 1.1, cone: 1, life: 1.3, spread: 1, grav: 5 });
  spawn(p, 40, { colors: ['#ffffff'], speed: 11, up: 1.4, cone: 0.25, life: 1, spread: 0.6, grav: 2 });
  if (box.kind === 'sweet') lidFly = { x: (Math.random() - 0.5) * 2, y: 9, z: 1.5, ry: 12, rx: (Math.random() - 0.5) * 4 };
  if (box.kind === 'royal') for (let i = 0; i < 16; i++) {
    const m = new THREE.Mesh(coinGeo, coinMat); m.position.copy(p); scene.add(m);
    const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 2.5;
    coins.push({ m, v: V3(Math.cos(a) * s, 6 + Math.random() * 4, Math.sin(a) * s), r: V3(Math.random() * 14, Math.random() * 14, 0), life: 1.8 });

renderer.domElement.addEventListener('pointerdown', () => tap());
addEventListener('message', (e) => {
  const m = e.data || {};
  if (m.type === 'box-ping') post({ type: 'box-stage-ready' });
  if (m.type === 'box-open-req') { try { open(m); } catch (err) { console.error(err); post({ type: 'box-error', msg: String(err && err.message) }); return; } last = performance.now(); renderer.setAnimationLoop(loop); }
  if (m.type === 'box-close') { clear(); S = 'off'; controls.enabled = false; renderer.clear(); renderer.setAnimationLoop(null); }
});

const eob = (x) => { const n = 7.5625, d = 2.75; if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + 0.75; if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + 0.9375; return n * (x -= 2.625 / d) * x + 0.984375; };
const elastic = (x) => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * (2 * Math.PI / 3)) + 1;
const cl = (x) => Math.max(0, Math.min(1, x));
let last = performance.now();
function loop() { try { step(); } catch (err) { console.error('box-stage', err); post({ type: 'box-error', msg: String(err && err.message) }); try { renderer.render(scene, camera); } catch (e2) {} } }
function step() {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt; t += dt;
  if (S === 'off' || !box) { renderer.clear(); return; }
  { const a = -340 * (sp.sq - 1) - 15 * sp.sqv; sp.sqv += a * dt; sp.sq += sp.sqv * dt; }
  { const a = -260 * (sp.lid - sp.lidT) - 11 * sp.lidv; sp.lidv += a * dt; sp.lid += sp.lidv * dt; }
  sp.hopv -= 22 * dt; sp.hop += sp.hopv * dt; if (sp.hop < 0) { if (sp.hopv < -2) sp.sqv -= Math.min(10, -sp.hopv * 1.2); sp.hop = 0; sp.hopv = 0; }
  const y = Math.max(0.6, sp.sq), R = box.root;
  R.scale.set(1 / Math.sqrt(y), y, 1 / Math.sqrt(y));
  if (box.ears) box.ears.forEach((e) => { e.rotation.x *= Math.pow(0.02, dt); });
  if (box.crown) box.crown.rotation.y += dt * 0.8;
  if (S === 'drop') {
    const k = cl(t / 0.75); R.position.y = 7 * (1 - eob(k)); R.rotation.y = -0.35 + (1 - k) * Math.PI * 1.2;
    shadow.scale.setScalar(0.4 + k * 0.6); shadow.material.opacity = k;
    if (k >= 1) { S = 'idle'; t = 0; sp.sqv -= 9; waveT = 0; spawn(V3(0, 0.1, 0), 26, { colors: ['#ffffff', ...box.parts], speed: 4, up: 0.35, cone: 1, life: 0.7, spread: 2, grav: 2 }); post({ type: 'box-land' }); if (fast) { taps = 3; burst(); } }
  } else if (S === 'idle') {
    const w = 0.025 + taps * 0.03;
    R.position.y = sp.hop + Math.sin(T * 2.2) * 0.04;
    R.rotation.z = Math.sin(T * (5 + taps * 5)) * w; R.rotation.y = -0.35 + Math.sin(T * 1.1) * 0.15;
    sp.lidT = -0.06 - taps * 0.05;
    inner.position.set(0, R.position.y + box.top - 0.1, 0.3); inner.intensity = Math.max(1.5 + taps * 2.5, inner.intensity - dt * 12);
    if (box.seam) { box.seam.material.opacity = 0.2 + taps * 0.27 + Math.sin(T * 12) * 0.08; box.keyhole.material.color.setHSL(0.13, 1, 0.7 + taps * 0.08); }
    if (Math.random() < dt * (3 + taps * 6)) spawn(V3((Math.random() - 0.5) * 2.4, R.position.y + Math.random() * 1.8, (Math.random() - 0.5) * 2), 1, { colors: box.parts, speed: 0.6, up: 1, cone: 0.3, life: 1.2, spread: 0.2, grav: -0.6 });
    auto += dt; if (auto > 1.1) tap();
  } else if (S === 'open' || S === 'inspect') {
    R.position.y = Math.max(0, R.position.y - dt * 2);
    R.rotation.z *= Math.pow(0.01, dt);
    if (box.kind === 'sweet' && lidFly) {
      lidFly.y -= 20 * dt; box.hinge.position.x += lidFly.x * dt; box.hinge.position.y += lidFly.y * dt; box.hinge.position.z += lidFly.z * dt;
      box.hinge.rotation.y += lidFly.ry * dt; box.hinge.rotation.x += lidFly.rx * dt;
    } else sp.lidT = box.kind === 'royal' ? -1.95 : -2.2;
    if (box.seam) box.seam.material.opacity = Math.max(0, 1 - t);
    inner.intensity = Math.max(0, inner.intensity - dt * 30);
    const bk = cl(t / 0.3); beam.scale.set(0.2 + bk * 0.9, 0.01 + bk, 0.2 + bk * 0.9); beam.material.opacity = 0.5 * (1 - cl((t - 0.25) / 0.45)); beam.rotation.y += dt;
    const sk = cl((t - 0.12) / 0.26);
    if (sk > 0 && sk < 1) { R.scale.multiplyScalar(Math.max(0.001, (1 + Math.sin(sk * Math.PI) * 0.25) * (1 - sk * sk))); R.rotation.y += dt * 14; } else if (sk >= 1) R.visible = false;
    if (sk >= 0.85 && !box.poofed) { box.poofed = true; spawn(V3(0, 0.6, 0), 40, { colors: ['#ffffff', ...box.parts], speed: 3.5, up: 0.6, cone: 1, life: 0.8, spread: 1.6, grav: 1 }); }
    const tk = cl((t - 0.36) / 0.9), s = toyScale * Math.max(0.001, elastic(tk));
    toy.scale.setScalar(s); toy.position.y = 0.5 + Math.min(1, tk * 1.4) * 0.8 + (S === 'inspect' ? Math.sin(T * 1.6) * 0.08 : 0);
    if (S === 'open') toy.rotation.y = (1 - Math.min(1, tk * 1.25)) * Math.PI * 3;
    const fo = cl((t - 0.36) / 0.4); toyMats.forEach((m) => { m.opacity = fo; if (fo >= 1 && m.transparent) { m.transparent = false; m.needsUpdate = true; } });

    if (S === 'open' && t > 1.5) { S = 'inspect'; controls.enabled = true; controls.autoRotate = true; renderer.domElement.classList.add('grab'); post({ type: 'box-ready' }); }
  }
  box.hinge.rotation.x = box.kind === 'sweet' && lidFly ? box.hinge.rotation.x : sp.lid;
  if (box.kind === 'sweet' && !lidFly) box.hinge.position.y = box.top - sp.lid * 0.6;

    const c = coins[i]; c.life -= dt; c.v.y -= 16 * dt; c.m.position.addScaledVector(c.v, dt); c.m.rotation.x += c.r.x * dt; c.m.rotation.y += c.r.y * dt;

post({ type: 'box-stage-ready' });
